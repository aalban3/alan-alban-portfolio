name: Release Portfolio

env:
  NODE_VERSION: "20"
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::099166177109:role/github-portfolio-deploy
  S3_BUCKET: alanalban.com
  CLOUDFRONT_DISTRIBUTION_ID: EYI2H4Z660V7Z

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy portfolio to S3 bucket
        run: |
          # Hashed assets can be cached forever; index.html must always revalidate.
          aws s3 sync ./dist/ s3://$S3_BUCKET --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp ./dist/index.html s3://$S3_BUCKET/index.html --cache-control "no-cache"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
